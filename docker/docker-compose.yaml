services:
  db:
    image: postgres:17
    container_name: project-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PT_POSTGRES_DB}
      POSTGRES_USER: ${PT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PT_POSTGRES_PASSWORD}
    ports:
      - "${PT_POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${PT_POSTGRES_USER} -d ${PT_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: project-tracker-backend
    restart: unless-stopped
    environment:
      PT_DATABASE_URL: ${PT_DATABASE_URL}
      PT_API_PORT: ${PT_API_PORT}
      PT_API_HOST: localhost
      PT_CORS_ALLOWED_ORIGINS: ${PT_CORS_ALLOWED_ORIGINS}
      PT_APP_ENV: ${PT_APP_ENV}
      PT_DEBUG: ${PT_DEBUG}
    ports:
      - "${PT_API_PORT}:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:${PT_API_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: project-tracker-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      FRONTEND_PORT: ${FRONTEND_PORT}
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
