[project]
name = "backend"
version = "0.1.0.dev0"
description = "REST api for the project tracking application"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.135.3",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.13.1",
  "structlog>=25.5.0",
  "uvicorn[standard]>=0.44.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
